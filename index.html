<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#080c18" />
  <title>TOPSHELFMI — Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ═════════════════════════════════════════════════
       RESET & THEME (MIDNIGHT BLUE & GOLD AMBER)
    ═════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #080c18;              /* profondo blu notte dello sfondo logo */
      --bg-card:     #0f1629;              /* blu notte elevato */
      --surface-box: rgba(16, 23, 44, 0.85); /* contenitore filtri */
      --pill-bg:     #172038;              /* sfondo pill inattive */
      --pill-border: rgba(130, 160, 230, 0.16);
      --gold:        #f5a623;              /* oro / ambra caldo del logo */
      --gold-bright: #ffbe3b;
      --gold-glow:   rgba(245, 166, 35, 0.28);
      --text-white:  #ffffff;
      --text-dim:    #9aa5c4;
      --text-gold:   #f5a623;
      --font-main:   'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display:'Outfit', sans-serif;
      --radius-card: 18px;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      /* Sfondo ispirato allo skyline notturno del logo (luci della città) */
      background-image:
        radial-gradient(ellipse 100% 50% at 50% 100%, rgba(20, 38, 85, 0.5) 0%, transparent 65%),
        radial-gradient(circle 2.5px at 12% 78%, rgba(255, 205, 90, 0.75) 0%, transparent 2.5px),
        radial-gradient(circle 2px at 24% 72%, rgba(255, 185, 60, 0.6) 0%, transparent 2px),
        radial-gradient(circle 2.5px at 36% 80%, rgba(255, 220, 100, 0.7) 0%, transparent 2.5px),
        radial-gradient(circle 2px at 48% 74%, rgba(255, 195, 70, 0.55) 0%, transparent 2px),
        radial-gradient(circle 3px at 62% 76%, rgba(255, 200, 80, 0.75) 0%, transparent 3px),
        radial-gradient(circle 2px at 74% 70%, rgba(255, 180, 60, 0.6) 0%, transparent 2px),
        radial-gradient(circle 2.5px at 86% 75%, rgba(255, 215, 90, 0.65) 0%, transparent 2.5px),
        radial-gradient(circle 2px at 18% 65%, rgba(255, 200, 80, 0.45) 0%, transparent 2px),
        radial-gradient(circle 2px at 42% 67%, rgba(255, 190, 70, 0.4) 0%, transparent 2px),
        radial-gradient(circle 2px at 68% 64%, rgba(255, 200, 80, 0.4) 0%, transparent 2px),
        radial-gradient(circle 2px at 82% 66%, rgba(255, 185, 65, 0.45) 0%, transparent 2px);
      background-attachment: fixed;
      color: var(--text-white);
      font-family: var(--font-main);
      min-height: 100dvh;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    /* ═════════════════════════════════════════════════
       HERO & BRAND HEADER
    ═════════════════════════════════════════════════ */
    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px 20px;
      text-align: center;
    }

    /* Alone luminoso elegante dietro al logo */
    .hero::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 240px;
      background: radial-gradient(ellipse at center, rgba(245,166,35,0.18) 0%, rgba(24,42,100,0.3) 50%, transparent 75%);
      pointer-events: none;
      z-index: 0;
    }

    /* Mascotte circolare */
    .hero-avatar-wrap {
      position: relative;
      width: 105px;
      height: 105px;
      margin-bottom: 14px;
      z-index: 1;
    }

    .hero-avatar {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      box-shadow: 0 0 24px rgba(245, 166, 35, 0.35);
      display: block;
    }

    .hero-avatar-ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: var(--gold);
      border-right-color: rgba(245,166,35,0.3);
      animation: spinRing 9s linear infinite;
    }

    @keyframes spinRing { to { transform: rotate(360deg); } }

    /* Immagine personalizzata scritta FONT TOPSHELF */
    .hero-brand-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 340px;
      display: flex;
      justify-content: center;
      margin-bottom: 6px;
    }

    .hero-brand-img {
      width: 100%;
      max-width: 290px;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6)) drop-shadow(0 0 20px rgba(245,166,35,0.25));
    }

    .hero-tagline {
      font-family: var(--font-display);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 4px;
      z-index: 1;
    }

    /* Tasto ORDINA QUI Telegram */
    .btn-order-telegram {
      margin-top: 15px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: linear-gradient(135deg, #f5a623 0%, #e08b10 100%);
      color: #080c18;
      padding: 10px 24px;
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(245, 166, 35, 0.4), 0 0 12px rgba(245, 166, 35, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .btn-order-telegram:hover, .btn-order-telegram:active {
      transform: scale(1.04);
      box-shadow: 0 6px 26px rgba(245, 166, 35, 0.65);
    }

    .btn-order-telegram svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .btn-modal-order {
      background: var(--gold);
      color: #080c18;
      padding: 6px 14px;
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(245, 166, 35, 0.4);
    }

    /* ═════════════════════════════════════════════════
       MACRO CATEGORY SWITCHER (ASH / WEED)
    ═════════════════════════════════════════════════ */
    .macro-nav-wrap {
      position: sticky;
      top: 0;
      z-index: 80;
      background: rgba(8, 12, 24, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(130, 160, 230, 0.12);
      padding: 0 16px;
    }

    .macro-nav {
      display: flex;
      justify-content: center;
      max-width: 440px;
      margin: 0 auto;
      gap: 12px;
    }

    .macro-btn {
      flex: 1;
      padding: 13px 0 11px;
      background: none;
      border: none;
      border-bottom: 2.5px solid transparent;
      color: var(--text-dim);
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .macro-btn.active {
      color: var(--text-white);
      border-bottom-color: var(--gold);
      text-shadow: 0 0 14px var(--gold-glow);
    }

    /* ═════════════════════════════════════════════════
       SUBCATEGORY FILTER BOX (IDENTICO AL REFERENCE)
    ═════════════════════════════════════════════════ */
    .filter-box {
      margin: 14px 12px 10px;
      background: var(--surface-box);
      border: 1px solid rgba(130, 160, 230, 0.15);
      border-radius: 14px;
      padding: 12px 12px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .filter-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .filter-box-title {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
    }

    .filter-box-count {
      font-family: var(--font-main);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold);
    }

    .filter-pills-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }

    .filter-pills-row::-webkit-scrollbar { display: none; }

    .pill-btn {
      flex-shrink: 0;
      padding: 7px 15px;
      border-radius: 8px;
      border: 1px solid var(--pill-border);
      background: var(--pill-bg);
      color: #cad3e8;
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .pill-btn:active {
      transform: scale(0.96);
    }

    /* Pill attiva come nel reference (arancione/oro pieno con testo scuro) */
    .pill-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #0c101c;
      font-weight: 900;
      box-shadow: 0 2px 12px rgba(245, 166, 35, 0.4);
    }

    /* ═════════════════════════════════════════════════
       GALLERY SECTIONS & 2-COLUMN GRID
    ═════════════════════════════════════════════════ */
    .gallery-container {
      padding: 6px 10px 20px;
    }

    .gallery-section {
      display: none;
    }

    .gallery-section.active {
      display: block;
    }

    /* Griglia 2 colonne per riga ESATTAMENTE come nella foto reference */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    /* ═════════════════════════════════════════════════
       VIDEO CARD (IDENTICA ALLA FOTO REFERENCE)
    ═════════════════════════════════════════════════ */
    .video-card {
      position: relative;
      aspect-ratio: 9 / 15.5;
      border-radius: var(--radius-card);
      overflow: hidden;
      background: #090d1a;
      border: 1px solid rgba(130, 160, 230, 0.14);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transform: translateZ(0);
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .video-card:active {
      transform: scale(0.98);
      border-color: var(--gold);
    }

    /* Video player in autoplay, mutato, loop continuo */
    .video-card video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none; /* lascia il click alla card */
    }

    /* Badge "● VIDEO" in alto a destra come nel reference */
    .card-video-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(10, 14, 26, 0.78);
      border: 1px solid rgba(245, 166, 35, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 3px 8px 3px 7px;
      color: var(--gold);
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .card-video-badge-dot {
      width: 5.5px;
      height: 5.5px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 6px var(--gold);
    }

    /* Sfumatura scura dal basso per rendere il testo leggibile sopra il video */
    .card-gradient-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.0) 40%,
        rgba(8, 12, 24, 0.55) 70%,
        rgba(6, 9, 18, 0.94) 100%
      );
      pointer-events: none;
    }

    /* Info prodotto in basso a sinistra (come nel reference) */
    .card-content {
      position: relative;
      z-index: 4;
      padding: 12px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .card-tag {
      font-family: var(--font-display);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--gold);
      line-height: 1;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1.15;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
      word-break: break-word;
    }

    /* Placeholder se non c'è ancora video */
    .card-no-video {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-dim);
      background: #0d1222;
    }

    .card-no-video svg {
      width: 32px;
      height: 32px;
      opacity: 0.35;
      stroke: var(--gold);
    }

    .card-no-video span {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.5;
    }

    /* ═════════════════════════════════════════════════
       EMPTY STATE
    ═════════════════════════════════════════════════ */
    .empty-state {
      grid-column: 1 / -1;
      padding: 60px 16px;
      text-align: center;
    }

    .empty-state-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(130, 160, 230, 0.08);
      border: 1px solid rgba(130, 160, 230, 0.15);
      color: var(--gold);
    }

    .empty-state p {
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .empty-state small {
      font-size: 0.68rem;
      color: rgba(154, 165, 196, 0.6);
      letter-spacing: 0.5px;
    }

    /* ═════════════════════════════════════════════════
       FULLSCREEN MODAL PLAYER (TOUCH/CLICK PER INGRANDIRE)
    ═════════════════════════════════════════════════ */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #000000;
      flex-direction: column;
    }

    .modal.open {
      display: flex;
    }

    .modal video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .modal-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: max(env(safe-area-inset-top), 16px) 16px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 10;
    }

    .modal-info {
      flex: 1;
    }

    .modal-tag {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 2px;
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1.15;
    }

    .modal-close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    /* ═════════════════════════════════════════════════
       FOOTER
    ═════════════════════════════════════════════════ */
    footer {
      margin-top: 40px;
      padding: 24px 16px;
      text-align: center;
      border-top: 1px solid rgba(130, 160, 230, 0.12);
    }

    footer p {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* Adattamento tablet/desktop */
    @media (min-width: 640px) {
      .video-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .filter-box { max-width: 720px; margin: 16px auto 14px; }
      .gallery-container { max-width: 960px; margin: 0 auto; }
    }

    @media (min-width: 1024px) {
      .video-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
    }
  </style>
</head>
<body>

  <!-- ═══════ HERO HEADER ═══════ -->
  <header class="hero">
    <div class="hero-avatar-wrap">
      <div class="hero-avatar-ring"></div>
      <img src="LOGO NUOVO.jpg" alt="TOPSHELF Logo" class="hero-avatar" />
    </div>

    <!-- Scritta FONT TOPSHELF originale fornita dall'utente -->
    <div class="hero-brand-wrap">
      <img src="FONT_TOPSHELF_TRANSPARENT.png" alt="TOPSHELFMI" class="hero-brand-img" />
    </div>

    <p class="hero-tagline">GALLERY — MILANO</p>

    <!-- Tasto ORDINA QUI Telegram -->
    <a href="https://t.me/tpmilano03" target="_blank" rel="noopener noreferrer" class="btn-order-telegram">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.77-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
      </svg>
      <span>ORDINA QUI</span>
    </a>
  </header>

  <!-- ═══════ MACRO CATEGORY NAV (ASH / WEED) ═══════ -->
  <div class="macro-nav-wrap">
    <nav class="macro-nav">
      <button class="macro-btn active" data-main="ash">ASH</button>
      <button class="macro-btn" data-main="weed">WEED</button>
    </nav>
  </div>

  <!-- ═══════ SECTION ASH ═══════ -->
  <main class="gallery-container">
    <section id="section-ash" class="gallery-section active">

      <!-- Box filtri e sottocategorie identico al reference -->
      <div class="filter-box">
        <div class="filter-box-header">
          <span class="filter-box-title" id="filterTitleLabel">SOTTOCATEGORIE ASH</span>
          <span class="filter-box-count" id="ashCountLabel">0 PRODOTTI</span>
        </div>
        <div class="filter-pills-row" id="ashPillsRow">
          <!-- Generato dinamicamente via JS -->
        </div>
      </div>

      <!-- Griglia video 2 colonne per riga -->
      <div class="video-grid" id="ashGrid"></div>
    </section>

    <!-- ═══════ SECTION WEED ═══════ -->
    <section id="section-weed" class="gallery-section">
      <div class="filter-box">
        <div class="filter-box-header">
          <span class="filter-box-title">CATALOGO WEED</span>
          <span class="filter-box-count" id="weedCountLabel">0 PRODOTTI</span>
        </div>
      </div>

      <div class="video-grid" id="weedGrid"></div>
    </section>
  </main>

  <!-- ═══════ FOOTER ═══════ -->
  <footer>
    <p>TOPSHELFMI &mdash; MILANO</p>
  </footer>

  <!-- ═══════ FULLSCREEN MODAL PLAYER ═══════ -->
  <div class="modal" id="videoModal" role="dialog" aria-modal="true">
    <div class="modal-bar">
      <div class="modal-info">
        <div class="modal-tag" id="modalTag"></div>
        <div class="modal-title" id="modalTitle"></div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <a href="https://t.me/tpmilano03" target="_blank" rel="noopener noreferrer" class="btn-modal-order">ORDINA</a>
        <button class="modal-close-btn" id="modalClose" aria-label="Chiudi">✕</button>
      </div>
    </div>
    <video id="modalVideo" controls playsinline loop></video>
  </div>

  <!-- ═══════ JAVASCRIPT & PRODUCT LIST ═══════ -->
  <script>
    /* ══════════════════════════════════════════════════
       LISTA PRODOTTI
       ──────────────────────────────────────────────
       Per aggiungere un nuovo prodotto:
       1. Trascina il video nella cartella corrispondente:
          - videos/ash/static/
          - videos/ash/fresh-frozen/
          - videos/ash/dry-sift/
          - videos/ash/mousse/
          - videos/ash/work/
          - videos/weed/

       2. Aggiungi un elemento all'array PRODUCTS:
       {
         category:    "ash",                          // "ash" o "weed"
         subcategory: "static",                       // "static" | "fresh-frozen" | "dry-sift" | "mousse" | "work" (oppure "" per weed)
         strain:      "NOME DELLO STRAIN",            // Mostrato in grande sulla card
         tag:         "STATIC",                       // Etichetta gialla sopra lo strain (es. "STATIC", "FRUTATECH FARM", ecc.)
         video:       "videos/ash/static/nomevideo.mp4"
       }
    ══════════════════════════════════════════════════ */
    // Dati iniziali di fallback (anche per apertura offline/locale)
    let appData = {
      categories: {
        ash: [
          { id: "static", name: "STATIC" },
          { id: "fresh-frozen", name: "FROZEN" },
          { id: "dry-sift", name: "DRY SIFT" },
          { id: "mousse", name: "MOUSSE" },
          { id: "work", name: "WORKLINE" }
        ],
        weed: []
      },
      products: [
        {
          id: "prod_1",
          category: "ash",
          subcategory: "static",
          strain: "BLACK MAGIC - FRIED BANANA",
          tag: "STATIC",
          video: "videos/ash/static/BLACK MAGIC - FRIED BANANA.MP4"
        },
        {
          id: "prod_2",
          category: "ash",
          subcategory: "static",
          strain: "BLACK MAGIC - YELLOW GMOZ",
          tag: "STATIC",
          video: "videos/ash/static/BLACK MAGIC - YELLOW GMOZ.MP4"
        }
      ]
    };

    let activeFilter = "all";

    const ashGrid         = document.getElementById("ashGrid");
    const weedGrid        = document.getElementById("weedGrid");
    const ashCountLabel   = document.getElementById("ashCountLabel");
    const weedCountLabel  = document.getElementById("weedCountLabel");
    const filterTitleLabel= document.getElementById("filterTitleLabel");
    const ashPillsRow     = document.getElementById("ashPillsRow");
    const modal           = document.getElementById("videoModal");
    const modalVideo      = document.getElementById("modalVideo");
    const modalTitle      = document.getElementById("modalTitle");
    const modalTag        = document.getElementById("modalTag");
    const modalClose      = document.getElementById("modalClose");

    function getSubcatName(id) {
      if (id === "all") return "TUTTI I PRODOTTI";
      const found = (appData.categories.ash || []).find(c => c.id === id);
      return found ? found.name : id.toUpperCase();
    }

    /* Genera dinamicamente le pillole delle sottocategorie */
    function renderSubcategoryPills() {
      if (!ashPillsRow) return;
      ashPillsRow.innerHTML = "";

      // Pulsante TUTTI
      const btnAll = document.createElement("button");
      btnAll.className = `pill-btn ${activeFilter === "all" ? "active" : ""}`;
      btnAll.dataset.filter = "all";
      btnAll.textContent = "TUTTI";
      btnAll.onclick = () => selectFilter("all");
      ashPillsRow.appendChild(btnAll);

      // Tutte le sottocategorie definite
      (appData.categories.ash || []).forEach(c => {
        const btn = document.createElement("button");
        btn.className = `pill-btn ${activeFilter === c.id ? "active" : ""}`;
        btn.dataset.filter = c.id;
        btn.textContent = c.name;
        btn.onclick = () => selectFilter(c.id);
        ashPillsRow.appendChild(btn);
      });
    }

    function selectFilter(filterId) {
      activeFilter = filterId;
      document.querySelectorAll(".pill-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.filter === filterId);
      });
      renderAsh(activeFilter);
    }

    /* Costruisce la card identica alla reference: video 100% in loop continuo, badge VIDEO in alto a destra, nome in basso */
    function createVideoCard(product) {
      const card = document.createElement("div");
      card.className = "video-card";

      const hasVideo = product.video && product.video.trim() !== "";

      if (hasVideo) {
        const videoEl = document.createElement("video");
        videoEl.src = product.video;
        videoEl.muted = true;
        videoEl.defaultMuted = true;
        videoEl.loop = true;
        videoEl.playsInline = true;
        videoEl.setAttribute("playsinline", "");
        videoEl.setAttribute("webkit-playsinline", "");
        videoEl.setAttribute("muted", "");
        videoEl.autoplay = true;
        videoEl.preload = "auto";

        const tryPlay = () => {
          const promise = videoEl.play();
          if (promise !== undefined) {
            promise.catch(() => {});
          }
        };

        videoEl.addEventListener("loadedmetadata", tryPlay);
        videoEl.addEventListener("canplay", tryPlay);

        if ("IntersectionObserver" in window) {
          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                tryPlay();
              } else {
                videoEl.pause();
              }
            });
          }, { threshold: 0.15 });
          observer.observe(videoEl);
        }

        card.appendChild(videoEl);

        const badge = document.createElement("div");
        badge.className = "card-video-badge";
        badge.innerHTML = `<span class="card-video-badge-dot"></span>VIDEO`;
        card.appendChild(badge);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "card-no-video";
        placeholder.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
            <path d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
          </svg>
          <span>VIDEO IN ARRIVO</span>
        `;
        card.appendChild(placeholder);
      }

      const overlay = document.createElement("div");
      overlay.className = "card-gradient-overlay";
      card.appendChild(overlay);

      const content = document.createElement("div");
      content.className = "card-content";
      const tagText = product.tag || getSubcatName(product.subcategory);
      content.innerHTML = `
        <div class="card-tag">${tagText}</div>
        <div class="card-title">${product.strain}</div>
      `;
      card.appendChild(content);

      if (hasVideo) {
        card.addEventListener("click", () => openModal(product));
      }

      return card;
    }

    function renderAsh(filter) {
      ashGrid.innerHTML = "";
      const items = (appData.products || []).filter(p => p.category === "ash" && (filter === "all" || p.subcategory === filter));

      if (items.length === 0) {
        ashGrid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
              </svg>
            </div>
            <p>NESSUN PRODOTTO PRESENTE</p>
            <small>Usa il pannello admin per caricare un video o sincronizzare le cartelle</small>
          </div>
        `;
      } else {
        items.forEach(p => ashGrid.appendChild(createVideoCard(p)));
      }

      const countText = filter === "all" 
        ? `${items.length} PRODOTTI (TUTTI I PRODOTTI)` 
        : `${items.length} PRODOTTO${items.length !== 1 ? 'I' : ''}`;
      
      ashCountLabel.textContent = countText;
      filterTitleLabel.textContent = filter === "all" ? "SOTTOCATEGORIE ASH" : `ASH — ${getSubcatName(filter)}`;
    }

    function renderWeed() {
      weedGrid.innerHTML = "";
      const items = (appData.products || []).filter(p => p.category === "weed");

      if (items.length === 0) {
        weedGrid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 5h2v6h-2zm0 8h2v2h-2z"/>
              </svg>
            </div>
            <p>NESSUN PRODOTTO PRESENTE</p>
            <small>Usa il pannello admin per caricare video in WEED</small>
          </div>
        `;
      } else {
        items.forEach(p => weedGrid.appendChild(createVideoCard(p)));
      }

      weedCountLabel.textContent = `${items.length} PRODOTTI (TUTTI I PRODOTTI)`;
    }

    function openModal(product) {
      modalTitle.textContent = product.strain;
      modalTag.textContent   = product.tag || getSubcatName(product.subcategory);
      modalVideo.src         = product.video;
      modalVideo.muted       = false;
      modalVideo.load();
      modalVideo.play().catch(() => {});
      modal.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      modal.classList.remove("open");
      modalVideo.pause();
      modalVideo.src = "";
      document.body.style.overflow = "";
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

    document.querySelectorAll(".macro-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const cat = btn.dataset.main;
        document.querySelectorAll(".macro-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        document.querySelectorAll(".gallery-section").forEach(s => s.classList.remove("active"));
        document.getElementById(`section-${cat}`).classList.add("active");
      });
    });

    /* Carica dati dinamici da server o data.json */
    async function initGallery() {
      try {
        const res = await fetch("/api/data");
        if (res.ok) {
          appData = await res.json();
        }
      } catch (e) {
        try {
          const res2 = await fetch("data.json");
          if (res2.ok) appData = await res2.json();
        } catch (e2) {}
      }

      renderSubcategoryPills();
      renderAsh(activeFilter);
      renderWeed();
    }

    initGallery();
  </script>
</body>
</html>
