<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#080c18" />
  <title>TOPSHELFMI — Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ═════════════════════════════════════════════════
       RESET & THEME (MIDNIGHT BLUE & GOLD AMBER)
    ═════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #080c18;              /* profondo blu notte dello sfondo logo */
      --bg-card:     #0f1629;              /* blu notte elevato */
      --surface-box: rgba(16, 23, 44, 0.85); /* contenitore filtri */
      --pill-bg:     #172038;              /* sfondo pill inattive */
      --pill-border: rgba(130, 160, 230, 0.16);
      --gold:        #f5a623;              /* oro / ambra caldo del logo */
      --gold-bright: #ffbe3b;
      --gold-glow:   rgba(245, 166, 35, 0.28);
      --text-white:  #ffffff;
      --text-dim:    #9aa5c4;
      --text-gold:   #f5a623;
      --font-main:   'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display:'Outfit', sans-serif;
      --radius-card: 18px;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--text-white);
      font-family: var(--font-main);
      min-height: 100dvh;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    /* Sfondo skyline GPU-accelerato isolato (rimuove il blocco di background-attachment: fixed su mobile) */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 100% 50% at 50% 100%, rgba(20, 38, 85, 0.5) 0%, transparent 65%),
        radial-gradient(circle 2.5px at 12% 78%, rgba(255, 205, 90, 0.75) 0%, transparent 2.5px),
        radial-gradient(circle 2px at 24% 72%, rgba(255, 185, 60, 0.6) 0%, transparent 2px),
        radial-gradient(circle 2.5px at 36% 80%, rgba(255, 220, 100, 0.7) 0%, transparent 2.5px),
        radial-gradient(circle 2px at 48% 74%, rgba(255, 195, 70, 0.55) 0%, transparent 2px),
        radial-gradient(circle 3px at 62% 76%, rgba(255, 200, 80, 0.75) 0%, transparent 3px),
        radial-gradient(circle 2px at 74% 70%, rgba(255, 180, 60, 0.6) 0%, transparent 2px),
        radial-gradient(circle 2.5px at 86% 75%, rgba(255, 215, 90, 0.65) 0%, transparent 2.5px),
        radial-gradient(circle 2px at 18% 65%, rgba(255, 200, 80, 0.45) 0%, transparent 2px),
        radial-gradient(circle 2px at 42% 67%, rgba(255, 190, 70, 0.4) 0%, transparent 2px),
        radial-gradient(circle 2px at 68% 64%, rgba(255, 200, 80, 0.4) 0%, transparent 2px),
        radial-gradient(circle 2px at 82% 66%, rgba(255, 185, 65, 0.45) 0%, transparent 2px);
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    /* ═════════════════════════════════════════════════
       HERO & BRAND HEADER
    ═════════════════════════════════════════════════ */
    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px 20px;
      text-align: center;
    }

    /* Alone luminoso elegante dietro al logo */
    .hero::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 240px;
      background: radial-gradient(ellipse at center, rgba(245,166,35,0.18) 0%, rgba(24,42,100,0.3) 50%, transparent 75%);
      pointer-events: none;
      z-index: 0;
    }

    /* Mascotte circolare */
    .hero-avatar-wrap {
      position: relative;
      width: 105px;
      height: 105px;
      margin-bottom: 14px;
      z-index: 1;
    }

    .hero-avatar {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      box-shadow: 0 0 24px rgba(245, 166, 35, 0.35);
      display: block;
    }

    .hero-avatar-ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: var(--gold);
      border-right-color: rgba(245,166,35,0.3);
      animation: spinRing 9s linear infinite;
    }

    @keyframes spinRing { to { transform: rotate(360deg); } }

    /* Immagine personalizzata scritta FONT TOPSHELF */
    .hero-brand-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 340px;
      display: flex;
      justify-content: center;
      margin-bottom: 6px;
    }

    .hero-brand-img {
      width: 100%;
      max-width: 290px;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6)) drop-shadow(0 0 20px rgba(245,166,35,0.25));
    }

    .hero-tagline {
      font-family: var(--font-display);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 4px;
      z-index: 1;
    }

    /* Tasto ORDINA QUI Telegram */
    .btn-order-telegram {
      margin-top: 15px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: linear-gradient(135deg, #f5a623 0%, #e08b10 100%);
      color: #080c18;
      padding: 10px 24px;
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(245, 166, 35, 0.4), 0 0 12px rgba(245, 166, 35, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .btn-order-telegram:hover, .btn-order-telegram:active {
      transform: scale(1.04);
      box-shadow: 0 6px 26px rgba(245, 166, 35, 0.65);
    }

    .btn-order-telegram svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .btn-modal-order {
      background: var(--gold);
      color: #080c18;
      padding: 6px 14px;
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(245, 166, 35, 0.4);
    }

    /* ═════════════════════════════════════════════════
       MACRO CATEGORY SWITCHER (ASH / WEED)
    ═════════════════════════════════════════════════ */
    .macro-nav-wrap {
      position: sticky;
      top: 0;
      z-index: 80;
      background: rgba(8, 12, 24, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(130, 160, 230, 0.12);
      padding: 0 16px;
    }

    .macro-nav {
      display: flex;
      justify-content: center;
      max-width: 440px;
      margin: 0 auto;
      gap: 12px;
    }

    .macro-btn {
      flex: 1;
      padding: 13px 0 11px;
      background: none;
      border: none;
      border-bottom: 2.5px solid transparent;
      color: var(--text-dim);
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .macro-btn.active {
      color: var(--text-white);
      border-bottom-color: var(--gold);
      text-shadow: 0 0 14px var(--gold-glow);
    }

    /* ═════════════════════════════════════════════════
       SUBCATEGORY FILTER BOX (IDENTICO AL REFERENCE)
    ═════════════════════════════════════════════════ */
    .filter-box {
      margin: 14px 12px 10px;
      background: var(--surface-box);
      border: 1px solid rgba(130, 160, 230, 0.15);
      border-radius: 14px;
      padding: 12px 12px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .filter-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .filter-box-title {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
    }

    .filter-box-count {
      font-family: var(--font-main);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold);
    }

    .filter-pills-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }

    .filter-pills-row::-webkit-scrollbar { display: none; }

    .pill-btn {
      flex-shrink: 0;
      padding: 7px 15px;
      border-radius: 8px;
      border: 1px solid var(--pill-border);
      background: var(--pill-bg);
      color: #cad3e8;
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .pill-btn:active {
      transform: scale(0.96);
    }

    /* Pill attiva come nel reference (arancione/oro pieno con testo scuro) */
    .pill-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #0c101c;
      font-weight: 900;
      box-shadow: 0 2px 12px rgba(245, 166, 35, 0.4);
    }

    /* ═════════════════════════════════════════════════
       GALLERY SECTIONS & 2-COLUMN GRID
    ═════════════════════════════════════════════════ */
    .gallery-container {
      padding: 6px 10px 20px;
    }

    .gallery-section {
      display: none;
    }

    .gallery-section.active {
      display: block;
    }

    /* Griglia 2 colonne per riga ESATTAMENTE come nella foto reference */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    /* ═════════════════════════════════════════════════
       VIDEO CARD (IDENTICA ALLA FOTO REFERENCE)
    ═════════════════════════════════════════════════ */
    .video-card {
      position: relative;
      aspect-ratio: 9 / 15.5;
      border-radius: var(--radius-card);
      overflow: hidden;
      background: #090d1a;
      border: 1px solid rgba(130, 160, 230, 0.14);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      will-change: transform;
      contain: layout paint;
      isolation: isolate;
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .video-card:active {
      transform: scale(0.98);
      border-color: var(--gold);
    }

    /* Video player in autoplay, mutato, loop continuo */
    .video-card video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none; /* lascia il click alla card */
      background: #090d1a;
    }

    /* Rimuove qualsiasi pulsante di riproduzione, triangolo o controllo nativo (iOS Safari, Android Chrome, ecc.) */
    .video-card video::-webkit-media-controls,
    .video-card video::-webkit-media-controls-start-playback-button,
    .video-card video::-webkit-media-controls-play-button,
    .video-card video::-webkit-media-controls-panel,
    .video-card video::-webkit-media-controls-enclosure {
      display: none !important;
      -webkit-appearance: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* Badge "● VIDEO" in alto a destra come nel reference */
    .card-video-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(10, 14, 26, 0.90);
      border: 1px solid rgba(245, 166, 35, 0.7);
      border-radius: 999px;
      padding: 3px 8px 3px 7px;
      color: var(--gold);
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .card-video-badge-dot {
      width: 5.5px;
      height: 5.5px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 6px var(--gold);
    }

    /* Sfumatura scura dal basso per rendere il testo leggibile sopra il video */
    .card-gradient-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.0) 40%,
        rgba(8, 12, 24, 0.55) 70%,
        rgba(6, 9, 18, 0.94) 100%
      );
      pointer-events: none;
    }

    /* Info prodotto in basso a sinistra (come nel reference) */
    .card-content {
      position: relative;
      z-index: 4;
      padding: 12px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .card-tag {
      font-family: var(--font-display);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--gold);
      line-height: 1;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1.15;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
      word-break: break-word;
    }

    /* Placeholder se non c'è ancora video */
    .card-no-video {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-dim);
      background: #0d1222;
    }

    .card-no-video svg {
      width: 32px;
      height: 32px;
      opacity: 0.35;
      stroke: var(--gold);
    }

    .card-no-video span {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.5;
    }

    /* ═════════════════════════════════════════════════
       EMPTY STATE
    ═════════════════════════════════════════════════ */
    .empty-state {
      grid-column: 1 / -1;
      padding: 60px 16px;
      text-align: center;
    }

    .empty-state-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(130, 160, 230, 0.08);
      border: 1px solid rgba(130, 160, 230, 0.15);
      color: var(--gold);
    }

    .empty-state p {
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .empty-state small {
      font-size: 0.68rem;
      color: rgba(154, 165, 196, 0.6);
      letter-spacing: 0.5px;
    }

    /* ═════════════════════════════════════════════════
       FULLSCREEN MODAL PLAYER (TOUCH/CLICK PER INGRANDIRE)
    ═════════════════════════════════════════════════ */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #000000;
      flex-direction: column;
    }

    .modal.open {
      display: flex;
    }

    .modal video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .modal-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: max(env(safe-area-inset-top), 16px) 16px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 10;
    }

    .modal-info {
      flex: 1;
    }

    .modal-tag {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 2px;
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1.15;
    }

    .modal-close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    /* ═════════════════════════════════════════════════
       FOOTER
    ═════════════════════════════════════════════════ */
    footer {
      margin-top: 40px;
      padding: 24px 16px;
      text-align: center;
      border-top: 1px solid rgba(130, 160, 230, 0.12);
    }

    footer p {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* Adattamento tablet/desktop */
    @media (min-width: 640px) {
      .video-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .filter-box { max-width: 720px; margin: 16px auto 14px; }
      .gallery-container { max-width: 960px; margin: 0 auto; }
    }

    @media (min-width: 1024px) {
      .video-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="bg-canvas"></div>

  <!-- ═══════ HERO HEADER ═══════ -->
  <header class="hero">
    <div class="hero-avatar-wrap">
      <div class="hero-avatar-ring"></div>
      <img src="LOGO NUOVO.jpg" alt="TOPSHELF Logo" class="hero-avatar" />
    </div>

    <!-- Scritta FONT TOPSHELF originale fornita dall'utente -->
    <div class="hero-brand-wrap">
      <img src="FONT_TOPSHELF_TRANSPARENT.png" alt="TOPSHELFMI" class="hero-brand-img" />
    </div>

    <p class="hero-tagline">GALLERY — MILANO</p>

    <!-- Tasto ORDINA QUI Telegram -->
    <a href="https://t.me/tpmilano03" target="_blank" rel="noopener noreferrer" class="btn-order-telegram">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.77-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
      </svg>
      <span>ORDINA QUI</span>
    </a>
  </header>

  <!-- ═══════ MACRO CATEGORY NAV (ASH / WEED) ═══════ -->
  <div class="macro-nav-wrap">
    <nav class="macro-nav">
      <button class="macro-btn active" data-main="ash">ASH</button>
      <button class="macro-btn" data-main="weed">WEED</button>
    </nav>
  </div>

  <!-- ═══════ SECTION ASH ═══════ -->
  <main class="gallery-container">
    <section id="section-ash" class="gallery-section active">

      <!-- Box filtri e sottocategorie identico al reference -->
      <div class="filter-box">
        <div class="filter-box-header">
          <span class="filter-box-title" id="filterTitleLabel">SOTTOCATEGORIE ASH</span>
          <span class="filter-box-count" id="ashCountLabel">0 PRODOTTI</span>
        </div>
        <div class="filter-pills-row" id="ashPillsRow">
          <!-- Generato dinamicamente via JS -->
        </div>
      </div>

      <!-- Griglia video 2 colonne per riga -->
      <div class="video-grid" id="ashGrid"></div>
    </section>

    <!-- ═══════ SECTION WEED ═══════ -->
    <section id="section-weed" class="gallery-section">
      <div class="filter-box">
        <div class="filter-box-header">
          <span class="filter-box-title">CATALOGO WEED</span>
          <span class="filter-box-count" id="weedCountLabel">0 PRODOTTI</span>
        </div>
      </div>

      <div class="video-grid" id="weedGrid"></div>
    </section>
  </main>

  <!-- ═══════ FOOTER ═══════ -->
  <footer>
    <p>TOPSHELFMI &mdash; MILANO</p>
  </footer>

  <!-- ═══════ FULLSCREEN MODAL PLAYER ═══════ -->
  <div class="modal" id="videoModal" role="dialog" aria-modal="true">
    <div class="modal-bar">
      <div class="modal-info">
        <div class="modal-tag" id="modalTag"></div>
        <div class="modal-title" id="modalTitle"></div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <a href="https://t.me/tpmilano03" target="_blank" rel="noopener noreferrer" class="btn-modal-order">ORDINA</a>
        <button class="modal-close-btn" id="modalClose" aria-label="Chiudi">✕</button>
      </div>
    </div>
    <video id="modalVideo" controls playsinline loop></video>
  </div>

  <!-- ═══════ JAVASCRIPT & PRODUCT LIST ═══════ -->
  <script>
    /* ══════════════════════════════════════════════════
       TOPSHELFMI — GALLERY ENGINE v5
       - Dual IntersectionObserver: buffers at 600px, plays at 100px
       - preload="none" initially → minimal startup bandwidth
       - bufferObserver starts downloading the video 600px before it's seen
       - cardObserver calls play() only when actually visible (already buffered)
       - Result: videos start immediately with zero stutter on any connection
    ══════════════════════════════════════════════════ */

    let appData = {
      categories: {
        ash: [
          { id: "static",        name: "STATIC"        },
          { id: "fresh-frozen",  name: "FRESH FROZEN"  },
          { id: "dry-sift",      name: "DRY SIFT"      },
          { id: "mousse",        name: "MOUSSE"         },
          { id: "work",          name: "WORK"           },
          { id: "plasma-static", name: "PLASMA"         },
          { id: "dry-sift-90u",  name: "DRY SIFT 90U"  }
        ],
        weed: []
      },
      products: []
    };

    let activeFilter  = "all";
    let activeSection = "ash";

    const ashGrid          = document.getElementById("ashGrid");
    const weedGrid         = document.getElementById("weedGrid");
    const ashCountLabel    = document.getElementById("ashCountLabel");
    const weedCountLabel   = document.getElementById("weedCountLabel");
    const filterTitleLabel = document.getElementById("filterTitleLabel");
    const ashPillsRow      = document.getElementById("ashPillsRow");
    const modal            = document.getElementById("videoModal");
    const modalVideo       = document.getElementById("modalVideo");
    const modalTitle       = document.getElementById("modalTitle");
    const modalTag         = document.getElementById("modalTag");
    const modalClose       = document.getElementById("modalClose");

    const STORE_KEY = "topshelf_store_v5";

    /* ─────────────────────────────────────────────────────────
       OBSERVER 1 — bufferObserver (600px pre-load margin)
       Quando una card si avvicina al viewport, chiama load()
       così il browser inizia a scaricare il video in anticipo.
       Viene rimosso subito (once) per evitare trigger ripetuti.
    ───────────────────────────────────────────────────────── */
    const bufferObserver = ("IntersectionObserver" in window)
      ? new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            const card = entry.target;
            const v = card._video;
            if (!v || v._srcLoaded) return;
            v._srcLoaded = true;
            v.preload = "auto";
            v.load();  // kick off the download while still off-screen
            bufferObserver.unobserve(card);
          });
        }, { rootMargin: "600px 0px 600px 0px" })
      : null;

    /* ─────────────────────────────────────────────────────────
       OBSERVER 2 — cardObserver (100px play margin)
       Avvia play() quando la card è visibile, pausa quando esce.
       A questo punto il video ha già scaricato 600px/~1s di dati.
    ───────────────────────────────────────────────────────── */
    const cardObserver = ("IntersectionObserver" in window)
      ? new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            const card = entry.target;
            const v = card._video;
            if (!v) return;
            if (modal.classList.contains("open") || card.style.display === "none") {
              v.pause();
              return;
            }
            if (entry.isIntersecting) {
              // Fallback: se bufferObserver non ha ancora caricato, fai ora
              if (!v._srcLoaded) {
                v._srcLoaded = true;
                v.preload = "auto";
                v.load();
                if (bufferObserver) bufferObserver.unobserve(card);
              }
              v.muted = true;
              const p = v.play();
              if (p !== undefined) p.catch(() => {});
            } else {
              v.pause();
            }
          });
        }, { rootMargin: "100px 0px 100px 0px", threshold: 0.05 })
      : null;

    function getSubcatName(id) {
      if (id === "all") return "TUTTI I PRODOTTI";
      const cats = [
        ...(appData.categories.ash  || []),
        ...(appData.categories.weed || [])
      ];
      const found = cats.find(c => c.id === id);
      return found ? found.name : id.toUpperCase();
    }

    /* ─────────────────────────────────────────────────────────
       CREA VIDEO CARD
       - preload="none" inizialmente (zero bandwidth waste)
       - src assegnato subito (il browser non scarica con preload=none)
       - poster assegnato per anteprima immediata senza nero
    ───────────────────────────────────────────────────────── */
    function createVideoCard(product) {
      const card = document.createElement("div");
      card.className = "video-card";
      card.dataset.subcategory = product.subcategory || "";
      card.dataset.category    = product.category    || "";

      const hasVideo = !!(product.video && product.video.trim());

      if (hasVideo) {
        const videoEl = document.createElement("video");
        videoEl.setAttribute("muted",                  "");
        videoEl.setAttribute("playsinline",             "");
        videoEl.setAttribute("webkit-playsinline",      "");
        videoEl.setAttribute("x5-playsinline",          "");
        videoEl.setAttribute("autoplay",                "");
        videoEl.setAttribute("loop",                    "");
        videoEl.setAttribute("preload",                 "none");
        videoEl.setAttribute("disablepictureinpicture", "");
        videoEl.setAttribute("disableremoteplayback",   "");

        videoEl.muted        = true;
        videoEl.defaultMuted = true;
        videoEl.playsInline  = true;
        videoEl.autoplay     = true;
        videoEl.loop         = true;
        videoEl._srcLoaded   = false;

        // Assegna src adesso: con preload=none il browser non scarica ancora nulla
        videoEl.src = product.video;

        if (product.poster) {
          videoEl.poster = product.poster;
        }

        card._video = videoEl;
        card.appendChild(videoEl);

        const badge = document.createElement("div");
        badge.className = "card-video-badge";
        badge.innerHTML = '<span class="card-video-badge-dot"></span>VIDEO';
        card.appendChild(badge);

        card.addEventListener("click", () => openModal(product));

        // Registra su entrambi gli observer
        if (bufferObserver) bufferObserver.observe(card);
        if (cardObserver)   cardObserver.observe(card);
      } else {
        const ph = document.createElement("div");
        ph.className = "card-no-video";
        ph.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/></svg><span>VIDEO IN ARRIVO</span>';
        card.appendChild(ph);
      }

      const overlay = document.createElement("div");
      overlay.className = "card-gradient-overlay";
      card.appendChild(overlay);

      const content = document.createElement("div");
      content.className = "card-content";
      const tagText = product.tag || getSubcatName(product.subcategory);
      content.innerHTML = '<div class="card-tag">' + tagText + '</div><div class="card-title">' + product.strain + '</div>';
      card.appendChild(content);

      return card;
    }

    function emptyStateHTML(sub) {
      return '<div class="empty-state"><div class="empty-state-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/></svg></div><p>NESSUN PRODOTTO PRESENTE</p><small>' + sub + '</small></div>';
    }

    /* Costruisce tutte le card una sola volta */
    function buildAllCards() {
      [ashGrid, weedGrid].forEach(grid => {
        grid.querySelectorAll(".video-card").forEach(c => {
          if (bufferObserver) bufferObserver.unobserve(c);
          if (cardObserver)   cardObserver.unobserve(c);
          if (c._video) { try { c._video.pause(); } catch(e){} }
        });
        grid.innerHTML = "";
      });

      const ashProducts  = (appData.products || []).filter(p => p.category === "ash");
      const weedProducts = (appData.products || []).filter(p => p.category === "weed");

      if (ashProducts.length === 0) {
        ashGrid.innerHTML = emptyStateHTML("Usa il pannello admin per caricare un video");
      } else {
        ashProducts.forEach(p => ashGrid.appendChild(createVideoCard(p)));
      }

      if (weedProducts.length === 0) {
        weedGrid.innerHTML = emptyStateHTML("Usa il pannello admin per caricare video in WEED");
      } else {
        weedProducts.forEach(p => weedGrid.appendChild(createVideoCard(p)));
      }

      applyFilter(activeFilter, false);
      if (weedCountLabel) weedCountLabel.textContent = weedProducts.length + " PRODOTTI (TUTTI I PRODOTTI)";
    }

    /* Filtro ASH via CSS show/hide — zero DOM rebuild */
    function applyFilter(filterId, updatePills) {
      if (updatePills === undefined) updatePills = true;
      activeFilter = filterId;

      if (updatePills) {
        document.querySelectorAll(".pill-btn").forEach(b =>
          b.classList.toggle("active", b.dataset.filter === filterId)
        );
      }

      let visible = 0;
      ashGrid.querySelectorAll(".video-card").forEach(card => {
        const show = filterId === "all" || card.dataset.subcategory === filterId;
        card.style.display = show ? "" : "none";
        if (show) visible++;
        else if (card._video) card._video.pause();
      });

      const countText = filterId === "all"
        ? (visible + " PRODOTTI (TUTTI I PRODOTTI)")
        : (visible + " PRODOTT" + (visible !== 1 ? "I" : "O"));
      if (ashCountLabel)    ashCountLabel.textContent    = countText;
      if (filterTitleLabel) filterTitleLabel.textContent = filterId === "all"
        ? "SOTTOCATEGORIE ASH"
        : ("ASH — " + getSubcatName(filterId));

      // Avvia i video ora visibili dentro il viewport tramite rAF (no layout thrashing)
      requestAnimationFrame(() => {
        if (activeSection !== "ash") return;
        const vh = window.innerHeight;
        ashGrid.querySelectorAll(".video-card").forEach(card => {
          if (card.style.display !== "none" && card._video) {
            const rect = card.getBoundingClientRect();
            if (rect.top < vh + 100 && rect.bottom > -100) {
              const v = card._video;
              if (!v._srcLoaded) {
                v._srcLoaded = true;
                v.preload = "auto";
                v.load();
                if (bufferObserver) bufferObserver.unobserve(card);
              }
              v.muted = true;
              v.play().catch(() => {});
            }
          }
        });
      });
    }

    function selectFilter(filterId) { applyFilter(filterId, true); }

    function renderSubcategoryPills() {
      if (!ashPillsRow) return;
      ashPillsRow.innerHTML = "";

      const all = document.createElement("button");
      all.className = "pill-btn" + (activeFilter === "all" ? " active" : "");
      all.dataset.filter = "all";
      all.textContent = "TUTTI";
      all.onclick = () => selectFilter("all");
      ashPillsRow.appendChild(all);

      (appData.categories.ash || []).forEach(c => {
        const btn = document.createElement("button");
        btn.className = "pill-btn" + (activeFilter === c.id ? " active" : "");
        btn.dataset.filter = c.id;
        btn.textContent = c.name;
        btn.onclick = () => selectFilter(c.id);
        ashPillsRow.appendChild(btn);
      });
    }

    function switchSection(cat) {
      if (activeSection === cat) return;
      const oldCat = activeSection;
      activeSection = cat;

      document.querySelectorAll(".macro-btn").forEach(b =>
        b.classList.toggle("active", b.dataset.main === cat)
      );

      // Pausa subito i video della sezione precedente
      const oldSection = document.getElementById("section-" + oldCat);
      if (oldSection) {
        oldSection.querySelectorAll("video").forEach(v => {
          try { v.pause(); } catch(e){}
        });
      }

      document.querySelectorAll(".gallery-section").forEach(s => s.classList.remove("active"));
      const newSection = document.getElementById("section-" + cat);
      newSection.classList.add("active");

      // Avvia i video visibili nella nuova sezione
      requestAnimationFrame(() => {
        const vh = window.innerHeight;
        newSection.querySelectorAll(".video-card").forEach(card => {
          if (card.style.display !== "none" && card._video) {
            const rect = card.getBoundingClientRect();
            if (rect.top < vh + 100 && rect.bottom > -100) {
              const v = card._video;
              if (!v._srcLoaded) {
                v._srcLoaded = true;
                v.preload = "auto";
                v.load();
                if (bufferObserver) bufferObserver.unobserve(card);
              }
              v.muted = true;
              v.play().catch(() => {});
            }
          }
        });
      });
    }

    document.querySelectorAll(".macro-btn").forEach(btn =>
      btn.addEventListener("click", () => switchSection(btn.dataset.main))
    );

    function openModal(product) {
      document.querySelectorAll(".video-card video").forEach(v => {
        try { v.pause(); } catch(e){}
      });
      modalTitle.textContent = product.strain;
      modalTag.textContent   = product.tag || getSubcatName(product.subcategory);
      if (product.poster) modalVideo.poster = product.poster;
      modalVideo.src   = product.video;
      modalVideo.muted = false;
      modalVideo.load();
      modalVideo.play().catch(() => {});
      modal.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      modal.classList.remove("open");
      modalVideo.pause();
      modalVideo.src = "";
      document.body.style.overflow = "";
      setTimeout(() => {
        const section = document.getElementById("section-" + activeSection);
        if (!section) return;
        const vh = window.innerHeight;
        section.querySelectorAll(".video-card").forEach(card => {
          if (card.style.display !== "none" && card._video) {
            const rect = card.getBoundingClientRect();
            if (rect.top < vh + 100 && rect.bottom > -100) {
              card._video.muted = true;
              card._video.play().catch(() => {});
            }
          }
        });
      }, 40);
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

    /* Sblocco al primo tocco (iOS Safari policy) */
    let _woken = false;
    function wakeOnce() {
      if (_woken) return;
      _woken = true;
      const section = document.getElementById("section-" + activeSection);
      if (!section) return;
      const vh = window.innerHeight;
      section.querySelectorAll(".video-card").forEach(card => {
        if (card.style.display !== "none" && card._video) {
          const rect = card.getBoundingClientRect();
          if (rect.top < vh + 100 && rect.bottom > -100) {
            const v = card._video;
            if (!v._srcLoaded) {
              v._srcLoaded = true;
              v.preload = "auto";
              v.load();
              if (bufferObserver) bufferObserver.unobserve(card);
            }
            v.muted = true;
            v.play().catch(() => {});
          }
        }
      });
    }
    ["touchstart", "click"].forEach(evt =>
      window.addEventListener(evt, wakeOnce, { passive: true, capture: true })
    );

    async function initGallery() {
      try {
        const res = await fetch("/api/data?t=" + Date.now(), {
          cache: "no-store",
          headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" }
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const remote = await res.json();
        if (remote && remote.categories) {
          appData = remote;
          try { localStorage.setItem(STORE_KEY, JSON.stringify(appData)); } catch(e) {}
        }
      } catch (e) {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          if (raw) { const p = JSON.parse(raw); if (p && p.categories) appData = p; }
        } catch(err) {}
      }

      if (!appData.categories) appData.categories = { ash: [], weed: [] };
      if (!Array.isArray(appData.products)) appData.products = [];

      renderSubcategoryPills();
      buildAllCards();
    }

    const syncChannel = ("BroadcastChannel" in window) ? new BroadcastChannel("topshelf_sync_bus") : null;
    if (syncChannel) {
      syncChannel.onmessage = (event) => {
        if (event.data && event.data.data) {
          appData = event.data.data;
          renderSubcategoryPills();
          buildAllCards();
        }
      };
    }

    window.addEventListener("storage", (e) => {
      if (e.key === STORE_KEY && e.newValue) {
        try {
          const p = JSON.parse(e.newValue);
          if (p && p.categories) {
            appData = p;
            renderSubcategoryPills();
            buildAllCards();
          }
        } catch(err) {}
      }
    });

    window.addEventListener("focus", () => {
      _woken = false;
      wakeOnce();
    });

    initGallery();
  </script>
</body>
